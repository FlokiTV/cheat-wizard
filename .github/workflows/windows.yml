name: windows-build-test

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned MSVC 14.43 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerRoot = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $installer = Join-Path $installerRoot 'setup.exe'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          $component = 'Microsoft.VisualStudio.Component.VC.14.43.17.13.x86.x64'

          foreach ($required in @($installer, $vswhere)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required Visual Studio installer tool not found: $required"
            }
          }

          $installPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $installPath) {
            throw 'Visual Studio 2022 installation not found.'
          }

          Write-Host "Visual Studio installation: $installPath"
          $arguments = @(
            'modify',
            '--installPath', ('"' + $installPath + '"'),
            '--add', $component,
            '--quiet',
            '--norestart',
            '--nocache'
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Installing MSVC 14.43 failed with exit code $($process.ExitCode)"
          }

          $toolset = Get-ChildItem (Join-Path $installPath 'VC\Tools\MSVC') -Directory |
            Where-Object Name -Like '14.43.*' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset) {
            throw "MSVC 14.43 toolset was not found after installer completed."
          }
          Write-Host "Installed MSVC toolset: $($toolset.Name)"
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T "version=14.43" -DBUILD_TESTING=ON
      - name: Verify pinned MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerFile = Get-ChildItem .\build\CMakeFiles -Recurse -Filter CMakeCXXCompiler.cmake |
            Select-Object -First 1
          if (-not $compilerFile) {
            throw 'CMakeCXXCompiler.cmake was not generated.'
          }

          $match = Select-String -LiteralPath $compilerFile.FullName -Pattern 'set\(CMAKE_CXX_COMPILER_VERSION "([^"]+)"\)'
          if (-not $match -or $match.Matches.Count -eq 0) {
            throw "Could not read the MSVC compiler version from $($compilerFile.FullName)"
          }

          $compilerVersion = $match.Matches[0].Groups[1].Value
          Write-Host "CMake selected MSVC compiler version: $compilerVersion"
          if ($compilerVersion -notmatch '^19\.43\.') {
            throw "CI requires MSVC 19.43.x, got $compilerVersion"
          }
      - name: Build
        run: cmake --build build --config Release
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: CLI smoke start
        shell: pwsh
        run: '"quit" | .\build\Release\cw.exe'
      - name: Trainer builder smoke
        shell: pwsh
        run: .\tests\TrainerBuilderSmoke.ps1 -Builder .\build\Release\cw-trainer-builder.exe -WorkDir .\build\trainer-smoke
